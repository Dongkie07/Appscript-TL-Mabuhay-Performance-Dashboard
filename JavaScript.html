    function createPreviewCapacityView(branches) {
      return {
        basis: "LATEST_AVAILABLE_PER_BRANCH",
        tdc: createPreviewCapacityCourse(
          branches,
          "tdc",
          "TDC",
        ),
        pdc: createPreviewCapacityCourse(
          branches,
          "pdc",
          "PDC",
        ),
      };
    }

    function createPreviewCapacityCourse(
      branches,
      prefix,
      courseCode,
    ) {
      const courseBranches = branches
        .filter((branch) => branch[`${prefix}Allocated`] != null)
        .map((branch) => {
          const allocated = branch[`${prefix}Allocated`];
          const used = branch[`${prefix}Used`];
          const trend = branch[`${prefix}Trend`];
          const previousUtilization =
            trend.previousUtilization;
          const previousUsed =
            (allocated * previousUtilization) / 100;
          const periodUsed = used + previousUsed;
          const periodAllocated = allocated * 2;

          return {
            branchKey: branch.branchKey,
            branchName: branch.branchName,
            region: branch.region,
            latest: {
              periodKey: 202630,
              periodLabel: "Week 30, 2026",
              allocated,
              used,
              idle: Math.max(allocated - used, 0),
              aboveAllocation: Math.max(used - allocated, 0),
              utilization: branch[`${prefix}Utilization`],
            },
            previous: {
              periodKey: 202629,
              periodLabel: "Week 29, 2026",
              allocated,
              used: previousUsed,
              idle: Math.max(allocated - previousUsed, 0),
              aboveAllocation: Math.max(previousUsed - allocated, 0),
              utilization: previousUtilization,
            },
            trend,
            periodAverage: {
              allocated: periodAllocated,
              used: periodUsed,
              idle: Math.max(
                periodAllocated - periodUsed,
                0,
              ),
              utilization:
                (periodUsed / periodAllocated) * 100,
              reports: 2,
            },
          };
        });

      const latestAllocated = courseBranches.reduce(
        (sum, branch) => sum + branch.latest.allocated,
        0,
      );
      const latestUsed = courseBranches.reduce(
        (sum, branch) => sum + branch.latest.used,
        0,
      );
      const previousAllocated = courseBranches.reduce(
        (sum, branch) => sum + branch.previous.allocated,
        0,
      );
      const previousUsed = courseBranches.reduce(
        (sum, branch) => sum + branch.previous.used,
        0,
      );
      const periodAllocated = courseBranches.reduce(
        (sum, branch) =>
          sum + branch.periodAverage.allocated,
        0,
      );
      const periodUsed = courseBranches.reduce(
        (sum, branch) => sum + branch.periodAverage.used,
        0,
      );
      const currentUtilization =
        latestAllocated > 0
          ? (latestUsed / latestAllocated) * 100
          : null;
      const previousUtilization =
        previousAllocated > 0
          ? (previousUsed / previousAllocated) * 100
          : null;
      const movementCounts = {
        growing: courseBranches.filter(
          (branch) => branch.trend.status === "GROWING",
        ).length,
        stable: courseBranches.filter(
          (branch) => branch.trend.status === "STABLE",
        ).length,
        declining: courseBranches.filter(
          (branch) => branch.trend.status === "DECLINING",
        ).length,
      };

      return {
        courseCode,
        summary: {
          latest: {
            allocated: latestAllocated,
            used: latestUsed,
            idle: Math.max(
              latestAllocated - latestUsed,
              0,
            ),
            utilization: currentUtilization,
          },
          periodAverage: {
            allocated: periodAllocated,
            used: periodUsed,
            idle: Math.max(
              periodAllocated - periodUsed,
              0,
            ),
            utilization:
              periodAllocated > 0
                ? (periodUsed / periodAllocated) * 100
                : null,
            reports: courseBranches.length * 2,
          },
          trend: createPreviewUtilizationTrend(
            currentUtilization,
            currentUtilization - previousUtilization,
          ),
          coverage: {
            branchesWithData: courseBranches.length,
            branchesWithUtilization: courseBranches.length,
            comparableBranches: courseBranches.length,
          },
          movementCounts,
        },
        branches: courseBranches,
      };
    }

    function createPreviewUtilizationTrend(
      currentUtilization,
      changePercentagePoints,
    ) {
      if (currentUtilization == null) {
        return {
          status: "INSUFFICIENT_DATA",
          changePercentagePoints: null,
          previousUtilization: null,
        };
      }

      let status = "STABLE";

      if (changePercentagePoints > 5) {
        status = "GROWING";
      } else if (changePercentagePoints < -5) {
        status = "DECLINING";
      }

      return {
        status,
        changePercentagePoints,
        previousUtilization:
          currentUtilization - changePercentagePoints,
      };
    }
  })();
