<style>
  :root {
    --ink: #172033;
    --muted: #667085;
    --soft: #8a94a6;
    --canvas: #f2f5f7;
    --surface: #ffffff;
    --line: #e4e8ee;
    --navy: #14233b;
    --teal: #0f766e;
    --teal-bright: #13a89e;
    --cyan-soft: #dff6f3;
    --amber: #d97706;
    --amber-soft: #fff2d8;
    --red: #c2414c;
    --red-soft: #fde8ea;
    --green: #16835b;
    --green-soft: #e3f5ed;
    --shadow: 0 12px 28px rgba(20, 35, 59, 0.08);
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
  }
  html {
    color-scheme: light;
  }
  body {
    margin: 0;
    min-width: 320px;
    background:
      radial-gradient(
        circle at 92% 0%,
        rgba(19, 168, 158, 0.1),
        transparent 26rem
      ),
      var(--canvas);
    color: var(--ink);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select {
    font: inherit;
  }
  button {
    cursor: pointer;
  }
  .mono {
    font-variant-numeric: tabular-nums;
  }
  .hidden {
    display: none !important;
  }

  .app-shell {
    width: min(1600px, 100%);
    margin: 0 auto;
    padding: 22px clamp(14px, 3vw, 38px) 48px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  .identity {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 13px;
  }

  .mark {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    flex: none;
    border-radius: 13px;
    background: linear-gradient(145deg, var(--teal-bright), var(--teal));
    box-shadow: 0 9px 20px rgba(15, 118, 110, 0.25);
    color: white;
    font-weight: 900;
    letter-spacing: -0.04em;
  }

  .eyebrow {
    margin-bottom: 4px;
    color: var(--teal);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  h1 {
    overflow: hidden;
    margin: 0;
    color: var(--navy);
    font-size: clamp(20px, 2.3vw, 30px);
    letter-spacing: -0.035em;
    line-height: 1.08;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid #cde8e4;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.84);
    color: var(--teal);
    font-size: 12px;
    font-weight: 800;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal-bright);
    box-shadow: 0 0 0 4px rgba(19, 168, 158, 0.12);
  }

  .button {
    min-height: 40px;
    padding: 0 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 750;
    transition:
      transform 0.15s ease,
      border-color 0.15s ease,
      box-shadow 0.15s ease;
  }

  .button:hover {
    transform: translateY(-1px);
    border-color: #cad2dd;
    box-shadow: 0 5px 14px rgba(20, 35, 59, 0.09);
  }

  .button:focus-visible,
  .branch-link:focus-visible,
  .dialog-close:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 3px solid rgba(19, 168, 158, 0.22);
    outline-offset: 2px;
  }

  .button.primary {
    border-color: var(--teal);
    background: var(--teal);
    color: white;
  }

  .refresh-icon {
    display: inline-block;
    margin-right: 7px;
    font-size: 15px;
  }

  .filter-card {
    display: grid;
    grid-template-columns:
      minmax(145px, 0.8fr)
      minmax(145px, 0.8fr)
      minmax(150px, 1fr)
      minmax(220px, 1.25fr)
      minmax(150px, auto);
    align-items: start;
    gap: 13px;
    padding: 16px;
    border: 1px solid rgba(228, 232, 238, 0.9);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.9);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
  }

  .field {
    display: grid;
    grid-template-rows:
      14px
      44px
      minmax(30px, auto);
    min-width: 0;
    gap: 6px;
  }

  .field label,
  .field-label-spacer {
    display: block;
    min-height: 14px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 850;
    letter-spacing: 0.09em;
    line-height: 14px;
    text-transform: uppercase;
  }

  .field-label-spacer {
    visibility: hidden;
  }

  .field input,
  .field select,
  .table-search {
    width: 100%;
    min-width: 0;
    height: 44px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fbfcfd;
    color: var(--ink);
    font-size: 13px;
    font-weight: 650;
    line-height: normal;
  }

  .field select {
    cursor: pointer;
  }

  .field input:hover,
  .field select:hover {
    border-color: #c8d0da;
  }

  .field input:focus-visible,
  .field select:focus-visible {
    border-color: var(--teal);
    outline: 3px solid rgba(199, 146, 36, 0.22);
    outline-offset: 1px;
  }

  .field-help {
    display: block;
    min-height: 30px;
    margin: 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 500;
    line-height: 1.4;
  }

  .filter-action-field {
    min-width: 150px;
  }

  .filter-action {
    width: 100%;
    height: 44px;
    min-height: 44px;
    margin: 0;
    padding-inline: 16px;
    white-space: nowrap;
  }

  .presets {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 2px 20px;
  }

  .preset {
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
  }

  .preset:hover {
    border-color: var(--line);
    background: rgba(255, 255, 255, 0.75);
    color: var(--teal);
  }

  .date-caption {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
  }

  .error-banner {
    margin: 0 0 16px;
    padding: 13px 15px;
    border: 1px solid #f4c8cd;
    border-radius: 11px;
    background: var(--red-soft);
    color: #8f2632;
    font-size: 13px;
    font-weight: 650;
    line-height: 1.45;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }

  .kpi {
    position: relative;
    min-height: 138px;
    overflow: hidden;
    padding: 17px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: 0 8px 21px rgba(20, 35, 59, 0.055);
  }

  .kpi::after {
    position: absolute;
    right: -28px;
    bottom: -38px;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: var(--accent-soft, var(--cyan-soft));
    content: "";
    opacity: 0.68;
  }

  .kpi.sales {
    --accent: var(--teal);
    --accent-soft: var(--cyan-soft);
  }
  .kpi.target {
    --accent: #4263a6;
    --accent-soft: #e7edfb;
  }
  .kpi.transactions {
    --accent: #7c5bb8;
    --accent-soft: #eee8f8;
  }
  .kpi.expenses {
    --accent: var(--amber);
    --accent-soft: var(--amber-soft);
  }
</style>
